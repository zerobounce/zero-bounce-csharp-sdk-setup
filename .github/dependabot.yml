# Dependabot: security updates for every ecosystem (grouped, auto-merged); version-update PRs only for
# the docker and github-actions ecosystems, so the pinned base-image digest and action SHAs are bumped
# (those PRs are left for a person to review and merge).
# Grouped security PRs open weekly on Tuesday morning (Europe/Bucharest).
# Auto-merge: .github/workflows/dependabot-auto-merge.yml (on PR + Tuesday cron).
# https://docs.github.com/en/code-security/dependabot/dependabot-security-updates

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/ZeroBounceSDK/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    labels:
      - "dependabot-security"
      - "nuget dependencies"
    groups:
      nuget-sdk-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/ZeroBounceTests/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    labels:
      - "dependabot-security"
      - "nuget dependencies"
    groups:
      nuget-tests-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/ZeroBounceSample/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    labels:
      - "dependabot-security"
      - "nuget dependencies"
    groups:
      nuget-sample-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 2
    labels:
      - "dependabot-security"
      - "github dependencies"
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      # init and analyze must move together (CodeQL fails when their versions differ).
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 2
    labels:
      - "dependabot-security"
      - "docker dependencies"
    # global.json pins SDK 10 and the tests target net10.0: only digest/patch updates of sdk:10.0.
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
