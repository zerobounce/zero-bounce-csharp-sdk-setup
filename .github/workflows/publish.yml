name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag to publish (e.g. v2.1.4)
        required: true

permissions:
  contents: read

# One publish at a time; a second run waits instead of cancelling a push to NuGet half-way.
concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-tag:
    outputs:
      tag_sha: ${{ steps.tag_sha.outputs.sha }}
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          re='^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "Error: the tag input must be a release tag such as v1.2.3."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false
      - name: Verify tag exists
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Error: Tag is required."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: Tag '$TAG' does not exist."
            exit 1
          fi
          
      - name: Verify manifest version matches tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          PKG_VERSION=$(grep -m1 -E '^[[:space:]]*<PackageVersion>' ZeroBounceSDK/ZeroBounceSDK.csproj | sed -E 's/.*<PackageVersion>([^<]+)<.*/\1/')
          if [ -z "$PKG_VERSION" ]; then
            echo "Error: could not read the version from ZeroBounceSDK/ZeroBounceSDK.csproj."
            exit 1
          fi
          if [ "$PKG_VERSION" != "${TAG#v}" ]; then
            echo "Error: ZeroBounceSDK/ZeroBounceSDK.csproj version ($PKG_VERSION) does not match tag ($TAG)."
            exit 1
          fi
          echo "Publishing $TAG (ZeroBounceSDK/ZeroBounceSDK.csproj version $PKG_VERSION)"

      - name: Record tag commit SHA
        id: tag_sha
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Test, pack and publish to NuGet
    needs: [validate-tag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ZeroBounceTests/ZeroBounceTests.csproj

      - name: Build
        run: dotnet build ZeroBounceTests/ZeroBounceTests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test ZeroBounceTests/ZeroBounceTests.csproj --no-build -c Release

      - name: Pack
        run: |
          rm -f ZeroBounceSDK/bin/Release/ZeroBounce.SDK.*.nupkg ZeroBounceSDK/bin/Release/ZeroBounce.SDK.*.snupkg
          dotnet pack ZeroBounceSDK/ZeroBounceSDK.csproj -c Release --no-build

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER || 'ZeroBounceIntegrations' }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          OIDC_NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          KEY="${NUGET_API_KEY:-$OIDC_NUGET_API_KEY}"
          if [ -z "$KEY" ]; then
            echo "Error: No NuGet API key. Configure trusted publishing or add NUGET_API_KEY secret."
            exit 1
          fi
          NUPKG=$(ls -t ZeroBounceSDK/bin/Release/ZeroBounce.SDK.*.nupkg 2>/dev/null | head -1)
          if [ -z "$NUPKG" ] || [ ! -f "$NUPKG" ]; then
            echo "Error: No .nupkg found under ZeroBounceSDK/bin/Release/"
            exit 1
          fi
          # The symbols package sits next to the .nupkg, and dotnet nuget push
          # pushes it to nuget.org's symbol server along with the package.
          SNUPKG="${NUPKG%.nupkg}.snupkg"
          if [ ! -f "$SNUPKG" ]; then
            echo "Error: No symbols package $SNUPKG next to $NUPKG"
            exit 1
          fi
          echo "Pushing $NUPKG and $SNUPKG to NuGet..."
          dotnet nuget push "$NUPKG" \
            --api-key "$KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  release:
    name: Create GitHub Release
    needs: [validate-tag, publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag_sha }}
          fetch-depth: 0

          persist-credentials: false
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
