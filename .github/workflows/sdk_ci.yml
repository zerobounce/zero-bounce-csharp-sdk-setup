# Run unit tests on every PR.
name: SDK CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Run tests
        run: dotnet test ZeroBounceTests/ZeroBounceTests.csproj --no-restore -v normal

      # The WPF sample targets Windows; EnableWindowsTargeting lets it compile here.
      - name: Build the sample
        run: dotnet build ZeroBounceSample/ZeroBounceSample.csproj --no-restore

      - name: Check the package
        run: |
          dotnet build ZeroBounceSDK/ZeroBounceSDK.csproj -c Release --no-restore
          dotnet pack ZeroBounceSDK/ZeroBounceSDK.csproj -c Release --no-build
          NUPKG=ZeroBounceSDK/bin/Release/ZeroBounce.SDK.$(sed -n 's:.*<PackageVersion>\(.*\)</PackageVersion>.*:\1:p' ZeroBounceSDK/ZeroBounceSDK.csproj).nupkg
          unzip -l "$NUPKG"
          unzip -l "$NUPKG" | grep -q 'lib/netstandard2.0/ZeroBounceSDK.xml' || { echo "No XML docs in $NUPKG"; exit 1; }
          if unzip -l "$NUPKG" | grep -qiE 'Tests|\.env'; then echo "Unexpected file in $NUPKG"; exit 1; fi
          test -f "${NUPKG%.nupkg}.snupkg" || { echo "No symbols package next to $NUPKG"; exit 1; }
